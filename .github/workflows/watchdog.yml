name: Apify Autonomous Watchdog

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apify Smoke Test & Verify Output
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.apify.com/v2/acts/${APIFY_ACTOR_ID}/runs?token=${APIFY_TOKEN}&waitForFinish=120" \
            -H "Content-Type: application/json" \
            -d '{"maxItems": 3}')

          STATUS=$(echo "$RESPONSE" | jq -r '.data.status')
          DATASET_ID=$(echo "$RESPONSE" | jq -r '.data.defaultDatasetId')

          ITEMS_COUNT=0
          if [ "$DATASET_ID" != "null" ] && [ -n "$DATASET_ID" ]; then
            ITEMS_COUNT=$(curl -s "https://api.apify.com/v2/datasets/${DATASET_ID}?token=${APIFY_TOKEN}" | jq -r '.data.itemCount')
          fi

          if [ "$STATUS" != "SUCCEEDED" ] || [ "$ITEMS_COUNT" -eq 0 ]; then
            MESSAGE="🚨 *ALERTA SCRAPER* 🚨%0A*Actor:* \`${APIFY_ACTOR_ID}\`%0A*Estado:* ${STATUS}%0A*Items:* ${ITEMS_COUNT}%0A⚠️ El portal objetivo ha cambiado su estructura o antibot. Pasa el log a la IA para parchear."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown"
            exit 1
          fi
